<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Gifts on the counter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #f4f0e6; color: #2a2622; font-family: "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 48px 0; }
  .mark { font-family: Georgia, "Times New Roman", serif; font-size: 28px; letter-spacing: -0.04em; }
  .mark i { color: #1f3d32; font-style: normal; }
  nav { display: flex; gap: 28px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  nav b { font-weight: 500; border-bottom: 1px solid #2a2622; padding-bottom: 3px; }
  .stage { margin: 18px 48px 0; display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 28px; height: 620px; }
  .hero { background: #e6dfd2; padding: 32px 36px; display: flex; flex-direction: column; justify-content: space-between; }
  .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8175; }
  h1 { margin-top: 12px; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 84px; line-height: 0.88; letter-spacing: -0.05em; }
  h1 em { font-style: italic; font-weight: 300; }
  .price { margin-top: 16px; font-size: 22px; }
  .note { max-width: 420px; margin-top: 10px; font-size: 16px; line-height: 1.4; color: #5c564e; }
  .slip { display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px; align-items: end; }
  label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6e675e; }
  .line { margin-top: 8px; border-bottom: 1px solid #2a2622; height: 34px; font-family: Georgia, serif; font-size: 20px; padding-top: 6px; }
  button { background: #1f3d32; color: #f4f0e6; border: 0; padding: 16px 18px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .side { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 8px; }
  .side h2 { font-family: Georgia, serif; font-size: 40px; letter-spacing: -0.04em; line-height: 0.95; }
  .side p { margin-top: 12px; font-size: 18px; }
  .rest { margin: 22px 48px 0; border-top: 1px solid #2a2622; display: grid; grid-template-columns: 90px 1fr 1fr; }
  .rest h3 { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; padding-top: 16px; color: #8a8175; }
  .rest div { padding: 14px 0 0 16px; font-family: Georgia, serif; font-size: 24px; letter-spacing: -0.03em; }
  .rest span { display: block; margin-top: 6px; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; color: #6e675e; }
</style>
</head>
<body>
  <header>
    <div class="mark">mori<i>.</i></div>
    <nav><span>Studio</span><b>Cửa hàng</b><span>Đặt lịch</span></nav>
  </header>
  <div class="stage">
    <article class="hero">
      <div>
        <p class="kicker">Quà · Nội dung mẫu</p>
        <h1>Hộp quà<br><em>da mặt.</em></h1>
        <p class="price">890.000đ</p>
        <p class="note">Sữa rửa, serum, và mặt nạ, gói để mang đi. Nhận tại studio.</p>
      </div>
      <form class="slip">
        <label>Tên<div class="line">Lan Anh</div></label>
        <label>Điện thoại<div class="line">0901 234 567</div></label>
        <button type="button">Gửi yêu cầu</button>
      </form>
    </article>
    <aside class="side">
      <p class="kicker">Quà 02</p>
      <h2>Thẻ liệu trình</h2>
      <p>1.500.000đ</p>
    </aside>
  </div>
  <section class="rest">
    <h3>Tiếp theo</h3>
    <div>Mặt<span>Sữa rửa mặt gạo · 320.000đ</span></div>
    <div>Cơ thể<span>Dầu oải hương · 520.000đ</span></div>
  </section>
</body>
</html>
